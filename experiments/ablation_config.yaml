# -*- coding: utf-8 -*-
# 消融实验配置
# 三组实验（A0/A1/A2）除数据增强策略外，其余训练参数完全一致

common:
  model: yolov8n.pt
  data: 100种中药分类数据集/data/data.yaml
  epochs: 100
  imgsz: 768
  batch: 16
  optimizer: SGD
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0008
  warmup_epochs: 5
  cos_lr: true
  close_mosaic: 10
  label_smoothing: 0.05
  patience: 30
  seed: 42
  deterministic: true
  workers: 0
  device: 0

experiments:
  A0:
    description: 基础模型（关闭数据增强）
    aug:
      mosaic: 0
      mixup: 0
      hsv_h: 0
      hsv_s: 0
      hsv_v: 0
      degrees: 0
      translate: 0
      scale: 0
      fliplr: 0
      erasing: 0
  A1:
    description: 加入 Mosaic + MixUp
    aug:
      mosaic: 1.0
      mixup: 0.15
      hsv_h: 0
      hsv_s: 0
      hsv_v: 0
      degrees: 0
      translate: 0
      scale: 0
      fliplr: 0
      erasing: 0
  A2:
    description: 完整增强（论文最终策略）
    aug:
      mosaic: 0.5
      mixup: 0.2
      hsv_h: 0.02
      hsv_s: 0.8
      hsv_v: 0.5
      degrees: 5
      translate: 0.1
      scale: 0.5
      fliplr: 0.5
      erasing: 0.4
      auto_augment: "randaugment"
